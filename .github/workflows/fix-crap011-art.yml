name: Fix CRAP011 artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-crap011-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch current Bandcamp artwork and update site
        shell: python
        run: |
          import html
          import re
          import pathlib
          import urllib.request

          album_url = 'https://fastercrapproduction.bandcamp.com/album/grimy-state-of-mind'
          req = urllib.request.Request(album_url, headers={'User-Agent': 'Mozilla/5.0'})
          page = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')

          patterns = [
              r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',
              r'<meta\s+content=["\']([^"\']+)["\']\s+property=["\']og:image["\']',
          ]
          art_url = None
          for pattern in patterns:
              m = re.search(pattern, page, re.I)
              if m:
                  art_url = html.unescape(m.group(1))
                  break
          if not art_url:
              raise RuntimeError('Could not find Bandcamp og:image')

          art_req = urllib.request.Request(art_url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': album_url})
          art = urllib.request.urlopen(art_req, timeout=30).read()
          out = pathlib.Path('assets/catalogue/crap011-grimy-state-of-mind.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(art)

          local = 'assets/catalogue/crap011-grimy-state-of-mind.jpg?v=20260810a'
          old = 'https://f4.bcbits.com/img/a3444540355_1x1_700.avif'
          for name in ['index.html', 'catalogue.html']:
              p = pathlib.Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace(old, local)
              p.write_text(text, encoding='utf-8')

          print('Bandcamp artwork:', art_url)
          print('Saved:', out, len(art), 'bytes')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalogue.html assets/catalogue/crap011-grimy-state-of-mind.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix CRAP011 artwork on home and catalogue"
            git push origin main
          fi
