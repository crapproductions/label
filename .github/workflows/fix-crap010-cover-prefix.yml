name: Fix CRAP010 cover URL

on:
  push:
    paths:
      - '.github/crap010-prefix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing Bandcamp album-art prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('catalogue.html')
          html = path.read_text()
          old = 'https://f4.bcbits.com/img/1393305814_10.jpg'
          new = 'https://f4.bcbits.com/img/a1393305814_10.jpg'
          count = html.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 broken CRAP010 URLs, found {count}')
          path.write_text(html.replace(old, new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.html
          git commit -m 'Fix CRAP010 Bandcamp cover URL'
          git push
