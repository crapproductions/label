name: Update CRAP010 description

on:
  push:
    paths:
      - '.github/crap010-description-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CRAP010 description only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('catalogue.html')
          html = path.read_text()
          old = 'SELECTED RECORDINGS FROM UNFINISHED PROJECT KID BLAST&#10;RECORDED IN 2019 - 2020 / ORIGINALLY 12 SONGS WERE WRITTEN &amp; RECORDED&#10;&#10;JUST A THROWAWAY FOR REMEMBERING HOW MUCH FUN WE HAD THOSE DAYS&#10;&#10;MUCH LOVE TO EVERYONE INVOLVED IN THIS PROJECT&#10;&#10;Released July 11, 2026&#10;&#10;2026 CRAP PRODUCTIONS'
          new = 'SELECTED RECORDINGS FROM KID BLAST PROJECT&#10;RECORDED IN 2019 - 2020 / ORIGINALLY 12 SONGS WERE WRITTEN &amp; RECORDED&#10;JUST A THROWAWAY TO REMEMBER HOW MUCH FUN WE HAD BACK THEN&#10;SEND LOVE TO EVERYONE WHO INVOLVED IN THIS PROJECT'
          count = html.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one CRAP010 description, found {count}')
          path.write_text(html.replace(old, new))
          PY
      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.html
          git commit -m 'Update CRAP010 description'
          git push
