name: Fix CRAP011 artwork via API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-crap011-art-api.yml'

permissions:
  contents: write

jobs:
  fix-art-api:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bandcamp art and patch repository via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import html
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = f'https://api.github.com/repos/{repo}'
          ua = 'Mozilla/5.0 CRAP-Productions-art-fix'

          def request(url, method='GET', data=None, auth=False, extra_headers=None):
              headers = {'User-Agent': ua, 'Accept': 'application/vnd.github+json'}
              if auth:
                  headers['Authorization'] = f'Bearer {token}'
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read(), dict(r.headers)

          album_url = 'https://fastercrapproduction.bandcamp.com/album/grimy-state-of-mind'
          page_bytes, _ = request(album_url)
          page = page_bytes.decode('utf-8', 'replace')
          patterns = [
              r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',
              r'<meta\s+content=["\']([^"\']+)["\']\s+property=["\']og:image["\']',
          ]
          art_url = None
          for pattern in patterns:
              m = re.search(pattern, page, re.I)
              if m:
                  art_url = html.unescape(m.group(1))
                  break
          if not art_url:
              raise RuntimeError('Bandcamp og:image not found')

          art_bytes, art_headers = request(art_url, extra_headers={'Referer': album_url})
          print('Artwork URL:', art_url)
          print('Artwork bytes:', len(art_bytes), 'content-type:', art_headers.get('Content-Type'))

          asset_path = 'assets/catalogue/crap011-grimy-state-of-mind.jpg'
          local_url = 'assets/catalogue/crap011-grimy-state-of-mind.jpg?v=20260810b'
          old_url = 'https://f4.bcbits.com/img/a3444540355_1x1_700.avif'

          def get_content(path):
              raw, _ = request(f'{api}/contents/{path}?ref=main', auth=True)
              obj = json.loads(raw)
              return base64.b64decode(obj['content']).decode('utf-8'), obj['sha']

          def put_content(path, content_bytes, message, sha=None):
              payload = {
                  'message': message,
                  'content': base64.b64encode(content_bytes).decode('ascii'),
                  'branch': 'main',
              }
              if sha:
                  payload['sha'] = sha
              data = json.dumps(payload).encode('utf-8')
              request(f'{api}/contents/{path}', method='PUT', data=data, auth=True,
                      extra_headers={'Content-Type': 'application/json'})

          # Create or replace the local artwork file.
          asset_sha = None
          try:
              raw, _ = request(f'{api}/contents/{asset_path}?ref=main', auth=True)
              asset_sha = json.loads(raw)['sha']
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          put_content(asset_path, art_bytes, 'Store current CRAP011 artwork locally', asset_sha)

          for path in ('index.html', 'catalogue.html'):
              text, sha = get_content(path)
              text = text.replace(old_url, local_url)
              # Also normalize an earlier local cache-busting version if present.
              text = re.sub(r'assets/catalogue/crap011-grimy-state-of-mind\.jpg\?v=[^"\s<]+', local_url, text)
              put_content(path, text.encode('utf-8'), f'Fix CRAP011 artwork in {path}', sha)

          print('Patched index.html and catalogue.html to:', local_url)
