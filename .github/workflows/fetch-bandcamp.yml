name: Fetch Bandcamp release metadata

on:
  push:
    paths:
      - '.github/workflows/fetch-bandcamp.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bandcamp page and artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bandcamp-release
          python3 - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.request

          url = 'https://fastercrapproduction.bandcamp.com/album/grimy-state-of-mind'
          request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              page_bytes = response.read()
          page = page_bytes.decode('utf-8', errors='replace')
          pathlib.Path('bandcamp-release/page.html').write_text(page, encoding='utf-8')

          def meta_value(key, attribute='property'):
              patterns = [
                  rf'<meta[^>]+{attribute}=["\']{re.escape(key)}["\'][^>]+content=["\']([^"\']+)["\']',
                  rf'<meta[^>]+content=["\']([^"\']+)["\'][^>]+{attribute}=["\']{re.escape(key)}["\']',
              ]
              for pattern in patterns:
                  match = re.search(pattern, page, flags=re.I)
                  if match:
                      return html.unescape(match.group(1))
              return ''

          metadata = {
              'url': url,
              'og_title': meta_value('og:title'),
              'og_description': meta_value('og:description'),
              'og_image': meta_value('og:image'),
              'twitter_image': meta_value('twitter:image', 'name'),
          }

          tralbum_match = re.search(r'data-tralbum=["\']([^"\']+)["\']', page, flags=re.I)
          if tralbum_match:
              raw = html.unescape(tralbum_match.group(1))
              try:
                  metadata['tralbum'] = json.loads(raw)
              except Exception as exc:
                  metadata['tralbum_parse_error'] = str(exc)
                  metadata['tralbum_raw'] = raw

          pathlib.Path('bandcamp-release/metadata.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          image_url = metadata['og_image'] or metadata['twitter_image']
          if image_url:
              image_request = urllib.request.Request(image_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(image_request, timeout=30) as response:
                  pathlib.Path('bandcamp-release/cover.jpg').write_bytes(response.read())

          print(json.dumps(metadata, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Upload fetched release
        uses: actions/upload-artifact@v4
        with:
          name: bandcamp-release
          path: bandcamp-release
          if-no-files-found: error
          retention-days: 1
