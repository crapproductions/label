name: Fetch CRAP010 Bandcamp cover

on:
  push:
    paths:
      - '.github/workflows/fetch-crap010-bandcamp-cover.yml'

permissions:
  contents: write

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bandcamp cover and commit it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          album_url='https://fastercrapproduction.bandcamp.com/album/officer-asia-to-oregon'
          page="$(curl -fsSL --retry 3 -A 'Mozilla/5.0' "$album_url")"

          printf '%s' "$page" > /tmp/bandcamp.html
          cover_url="$(python3 - <<'PY'
          import html, re
          source = open('/tmp/bandcamp.html', encoding='utf-8').read()
          patterns = [
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
          ]
          for pattern in patterns:
              match = re.search(pattern, source, re.I)
              if match:
                  print(html.unescape(match.group(1)))
                  break
          PY
          )"

          test -n "$cover_url"
          hi_res_url="$(printf '%s' "$cover_url" | sed -E 's/_[0-9]+\.jpg$/_10.jpg/')"

          if ! curl -fsSL --retry 3 -A 'Mozilla/5.0' "$hi_res_url" -o /tmp/crap010-bandcamp-cover.jpg; then
            curl -fsSL --retry 3 -A 'Mozilla/5.0' "$cover_url" -o /tmp/crap010-bandcamp-cover.jpg
          fi

          test "$(wc -c < /tmp/crap010-bandcamp-cover.jpg)" -gt 100000

          python3 - <<'PY' > /tmp/payload.json
          import base64, json
          with open('/tmp/crap010-bandcamp-cover.jpg', 'rb') as file:
              encoded = base64.b64encode(file.read()).decode('ascii')
          print(json.dumps({
              'message': 'Add high-resolution CRAP010 Bandcamp cover',
              'content': encoded,
              'branch': 'main',
          }))
          PY

          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/contents/assets/catalogue/crap010-bandcamp-cover.jpg" \
            --data-binary @/tmp/payload.json
