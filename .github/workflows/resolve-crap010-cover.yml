name: Apply CRAP010 Bandcamp cover

on:
  pull_request:
    paths:
      - '.github/crap010-cover-pr-trigger'

permissions:
  contents: write

jobs:
  apply-cover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Replace CRAP010 thumbnail with Bandcamp CDN artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'assets/catalogue/crap010-officer-asia-to-oregon.jpg?v=20260712d'
          new = 'https://f4.bcbits.com/img/1393305814_10.jpg'

          path = Path('catalogue.html')
          html = path.read_text()
          count = html.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 CRAP010 cover references, found {count}')
          path.write_text(html.replace(old, new))
          PY

      - name: Commit cover URL to pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.html
          git commit -m 'Use Bandcamp CDN artwork for CRAP010'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
