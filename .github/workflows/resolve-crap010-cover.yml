name: Resolve CRAP010 Bandcamp cover

on:
  pull_request:
    paths:
      - '.github/crap010-cover-pr-trigger'

permissions:
  contents: read

jobs:
  resolve-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve direct Bandcamp cover URL
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"search_text":"Officer / Asia To Oregon Kid Blast","search_filter":"a","full_page":false,"fan_id":null}' \
            'https://bandcamp.com/api/bcsearch_public_api/1/autocomplete_elastic' \
            -o /tmp/bandcamp-search.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('/tmp/bandcamp-search.json').read_text())
          results = ((data or {}).get('auto') or {}).get('results') or []
          print('RESULT_COUNT=' + str(len(results)))

          def flatten(value):
              if isinstance(value, dict):
                  return ' '.join(flatten(v) for v in value.values())
              if isinstance(value, list):
                  return ' '.join(flatten(v) for v in value)
              return str(value or '')

          match = next((r for r in results if 'officer' in flatten(r).lower() and 'oregon' in flatten(r).lower()), None)
          if not match:
              print(json.dumps(data, ensure_ascii=False))
              raise SystemExit('CRAP010 album was not found')

          print('MATCH=' + json.dumps(match, ensure_ascii=False))

          image_url = ''
          for key in ('img', 'image_url', 'art_url', 'img_url', 'image'):
              value = match.get(key)
              if isinstance(value, str) and 'bcbits.com' in value:
                  image_url = value
                  break

          if not image_url:
              for value in match.values():
                  if isinstance(value, str) and 'bcbits.com/img/' in value:
                      image_url = value
                      break

          if not image_url:
              raise SystemExit('Bandcamp result did not contain an image URL')

          image_url = re.sub(r'_[0-9]+\.jpg(?:\?.*)?$', '_10.jpg', image_url)
          print('CRAP010_COVER_URL=' + image_url)
          PY
