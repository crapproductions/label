name: Temporary Bandcamp cover lookup
on:
  push:
    paths:
      - ".github/workflows/tmp-fetch-bandcamp-cover.yml"

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Read Bandcamp feed
        shell: bash
        run: |
          URL='https://wholesome2069.bandcamp.com/feed'
          echo "RESULT_BEGIN"
          curl -L --silent --show-error -A 'Mozilla/5.0' "$URL" || true
          echo
          echo "RESULT_END"
          exit 0
