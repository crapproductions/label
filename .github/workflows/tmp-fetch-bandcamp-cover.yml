name: Temporary Bandcamp cover lookup
on:
  push:
    paths:
      - ".github/workflows/tmp-fetch-bandcamp-cover.yml"

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve artwork
        shell: bash
        run: |
          URL='https://bandcamp.com/api/mobile/24/tralbum_details?band_id=1&tralbum_type=a&tralbum_id=3323220293'
          echo "RESULT_BEGIN"
          curl -L --silent --show-error -A 'Mozilla/5.0' "$URL" || true
          echo
          echo "RESULT_END"
          exit 0
