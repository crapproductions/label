name: Temporary Bandcamp cover lookup
on:
  push:
    paths:
      - ".github/workflows/tmp-fetch-bandcamp-cover.yml"

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve artwork in browser
        shell: bash
        run: |
          URL='https://wholesome2069.bandcamp.com/album/stash-2'
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=15000 --dump-dom "$URL" > /tmp/dom.html 2>/tmp/chrome.err || true
          else
            touch /tmp/dom.html
          fi
          python - <<'PY'
          import re, html
          s=html.unescape(open('/tmp/dom.html',encoding='utf-8',errors='ignore').read())
          print("RESULT_BEGIN")
          seen=[]
          for pat in [
            r'https?://[^"\'<> ]*bcbits\.com/[^"\'<> ]+',
            r'["\']art_id["\']\s*[:=]\s*["\']?(\d+)',
            r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]+content=["\']([^"\']+)',
            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\']'
          ]:
            for m in re.finditer(pat,s,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if v not in seen:
                seen.append(v); print(v)
          print("TITLE")
          m=re.search(r'<title>(.*?)</title>',s,re.I|re.S)
          print(m.group(1).strip() if m else 'NO_TITLE')
          print("RESULT_END")
          PY
          exit 0
