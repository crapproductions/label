name: Temporary Bandcamp cover lookup
on:
  push:
    paths:
      - ".github/workflows/tmp-fetch-bandcamp-cover.yml"

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bandcamp artwork
        shell: bash
        run: |
          URL='https://wholesome2069.bandcamp.com/album/stash-2'
          curl -L --silent --show-error -A 'Mozilla/5.0' "$URL" -o /tmp/page.html || true
          python - <<'PY'
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          u=html.unescape(s)
          print("MATCHES_BEGIN")
          seen=set()
          for pat in [
              r'https?://[^"\'<> ]*bcbits\.com/[^"\'<> ]+',
              r'["\']art_id["\']\s*[:=]\s*["\']?(\d+)',
              r'["\']album_title["\']\s*[:=]\s*["\']([^"\']+)',
              r'["\']title["\']\s*[:=]\s*["\']Stash["\']'
          ]:
              for m in re.finditer(pat,u,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if v not in seen:
                      seen.add(v); print(v)
          print("MATCHES_END")
          PY
          exit 0
