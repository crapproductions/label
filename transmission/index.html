<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">

  <title>Transmitting From CRAP HQ — Crap Productions</title>
  <link rel="canonical" href="https://crap.productions/transmission/">

  <meta property="og:title" content="Transmitting From CRAP HQ">
  <meta property="og:description" content="Crap Productions">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crap.productions/transmission/">
  <meta property="og:site_name" content="Crap Productions">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Transmitting From CRAP HQ">
  <meta name="twitter:description" content="Crap Productions">

  <base href="/">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-sizing: border-box;
      padding: clamp(28px, 6vh, 64px) 18px 18px;
      overflow: hidden;
    }

    .transmission-figure {
      display: block;
      width: calc(72px * 13 / 3);
      height: auto;
      flex: 0 1 auto;
      object-fit: contain;
    }

    .transmission-console {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: max-content;
      max-width: 100%;
      gap: 3px;
      flex: 0 0 auto;
    }

    .transmission-console #crap-radio-player {
      margin: 0 !important;
      flex: 0 0 auto;
    }

    .transmission-status {
      height: 23px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 9px;
      box-sizing: border-box;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8.5px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: .09em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .transmission-on-air,
    .transmission-time-group {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .transmission-on-air {
      gap: 6px;
      flex: 0 0 auto;
    }

    .transmission-live-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #f00;
      animation: transmission-live-blink 1.15s steps(1, end) infinite;
    }

    .transmission-time-group {
      justify-content: flex-end;
      gap: 9px;
      margin-left: auto;
      text-align: right;
    }

    .transmission-time-value {
      min-width: 58px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: .06em;
    }

    @keyframes transmission-live-blink {
      0%, 54% { opacity: 1; }
      55%, 100% { opacity: .18; }
    }

    @media (max-width: 920px) {
      .transmission-figure {
        width: calc(64px * 13 / 3);
      }
    }

    @media (max-width: 680px) {
      body {
        gap: 10px;
        padding-top: clamp(22px, 5vh, 44px);
      }

      .transmission-figure {
        width: calc(62px * 13 / 3);
      }

      .transmission-console {
        gap: 3px;
      }

      .transmission-status {
        height: 20px;
        padding: 0 7px;
        gap: 8px;
        font-size: 7.5px;
        letter-spacing: .08em;
      }

      .transmission-on-air {
        gap: 5px;
      }

      .transmission-live-dot {
        width: 6px;
        height: 6px;
        flex-basis: 6px;
      }

      .transmission-time-group {
        gap: 8px;
      }

      .transmission-time-value {
        min-width: 53px;
      }
    }
  </style>
</head>
<body>
  <img class="transmission-figure" src="assets/ui/transmission-faster-crap.webp?v=20260904a" alt="" aria-hidden="true">

  <div class="transmission-console" id="transmission-console">
    <div class="transmission-status" aria-label="CRAP RADIO transmission status">
      <div class="transmission-on-air">
        <span class="transmission-live-dot" aria-hidden="true"></span>
        <span>ON AIR</span>
      </div>
      <div class="transmission-time-group">
        <span>TIME TRANSMITTED</span>
        <span class="transmission-time-value" id="transmission-time-value">000:00:00</span>
      </div>
    </div>
  </div>

  <script src="radio.js?v=20260903c" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const consoleEl = document.getElementById('transmission-console');
      const player = document.getElementById('crap-radio-player');
      const timeValue = document.getElementById('transmission-time-value');
      const transmissionStartedAt = Date.parse('2026-08-21T10:30:00+09:00');

      if (consoleEl && player) consoleEl.prepend(player);

      function updateTransmissionTime() {
        if (!timeValue || !Number.isFinite(transmissionStartedAt)) return;
        const elapsedSeconds = Math.max(0, Math.floor((Date.now() - transmissionStartedAt) / 1000));
        const hours = Math.floor(elapsedSeconds / 3600);
        const minutes = Math.floor((elapsedSeconds % 3600) / 60);
        const seconds = elapsedSeconds % 60;
        timeValue.textContent = `${String(hours).padStart(3, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      updateTransmissionTime();
      window.setInterval(updateTransmissionTime, 250);
    });
  </script>
</body>
</html>
